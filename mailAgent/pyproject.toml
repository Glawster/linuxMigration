[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailAgent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["organiseMyProjects", "textual>=0.50"]

[project.scripts]
mail-agent = "mailAgent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
