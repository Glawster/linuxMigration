hostname: andy-pc

network:
  connection: Wired connection 3
  address: 192.168.1.215/24
  gateway: 192.168.1.254
  dns: 192.168.1.254

profiles:
  - common
  - development
  - media

packages:
  apt:
    - code
    - openssh-server
    - nfs-kernel-server
  flatpak:
    - com.rustdesk.RustDesk

services:
  - ssh
  - nfs-kernel-server

# /mnt/video is NTFS through FUSE, so its export needs an explicit fsid.
nfsExports:
  - /mnt/video 192.168.1.201(rw,sync,no_subtree_check,fsid=11)
  - /mnt/movies 192.168.1.201(ro,sync,no_subtree_check)
  - /mnt/media 192.168.1.201(ro,sync,no_subtree_check)

nfsMounts:
  - raid-pc:/mnt/storage /mnt/raid rw,_netdev,nofail,x-systemd.automount

managedFiles:
  - ssh/media-hosts.conf|.ssh/config.d/media-hosts.conf

vscodeExtensions:
  - openai.chatgpt
  - vscodevim.vim

repositories:

git:
